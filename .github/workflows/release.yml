name: Release

# Started by the exact tag the App pushed in ci.yml, or by a tag pushed by hand.
# Needs: PGP_PRIVATE_KEY (secret).
on:
  push:
    tags: ['v*.*.*']

permissions: {}

jobs:
  release:
    permissions:
      contents: write
    uses: vhco-pro/go-release-workflow/.github/workflows/go-release.yml@311467ed4ba150944298460af16497abad8b7a69 # v0.1.0
    secrets:
      pgp-private-key: ${{ secrets.PGP_PRIVATE_KEY }}
